<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#C76C2E"><title>연결 확인 | 디아블로2 주고받고</title><style>body{margin:0;background:#080808;color:#ddd;font:16px/1.8 sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}main{max-width:460px;margin:24px;padding:28px;border:1px solid #8c6d3b;border-radius:10px}h1{font-size:22px;color:#d5b16b}a,button{display:inline-block;background:#c5a059;color:#080808;padding:10px 18px;border:0;border-radius:5px;font:inherit;text-decoration:none;margin:4px;cursor:pointer}a:focus-visible,button:focus-visible{outline:3px solid white}</style></head>
<body><main><h1>현재 페이지에 연결할 수 없습니다</h1><p>인터넷 연결 상태를 확인해 주세요. 연결 실패만으로 서버 장애 여부를 확정할 수는 없습니다.</p><p>작성 중이던 매물이나 댓글이 저장되지 않았을 수 있습니다. 다시 등록하기 전에 저장 여부를 확인해 주세요.</p><p id="connection" role="status"></p><button type="button" id="retry">현재 페이지 재접속</button><a href="/">거래소로 이동</a></main>
<script>
function describeConnection(){document.getElementById('connection').textContent=navigator.onLine?'기기는 온라인으로 표시되지만 사이트 연결은 별도 확인이 필요합니다.':'기기가 오프라인으로 표시됩니다. 네트워크 설정을 확인해 주세요.';}
describeConnection();window.addEventListener('online',describeConnection);window.addEventListener('offline',describeConnection);
document.getElementById('retry').addEventListener('click',function(){window.location.reload();});
</script></body></html>
